plugins {
    alias(libs.plugins.android.application)
}

def baiduApiKey = providers.gradleProperty("BAIDU_API_KEY").orElse("").get()
def baiduSecretKey = providers.gradleProperty("BAIDU_SECRET_KEY").orElse("").get()

android {
    namespace 'com.example.voiceinputapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.voiceinputapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "BAIDU_API_KEY", "\"${baiduApiKey}\""
        buildConfigField "String", "BAIDU_SECRET_KEY", "\"${baiduSecretKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
