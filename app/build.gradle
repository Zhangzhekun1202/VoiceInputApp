plugins {
    alias(libs.plugins.android.application)
}

def aliyunAppKey = providers.gradleProperty("ALIYUN_APP_KEY").orElse("").get()
def aliyunTokenEndpoint = providers.gradleProperty("ALIYUN_TOKEN_ENDPOINT").orElse("").get()

android {
    namespace 'com.example.voiceinputapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.voiceinputapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "ALIYUN_APP_KEY", "\"${aliyunAppKey}\""
        buildConfigField "String", "ALIYUN_TOKEN_ENDPOINT", "\"${aliyunTokenEndpoint}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
